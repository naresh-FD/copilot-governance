<svg viewBox="0 0 1240 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-label="Software Documentation SDLC flow diagram">
  <title>Software Documentation — SDLC Flow</title>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#5b8fa8"/>
    </marker>
    <marker id="arrw" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#3a7ca5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1240" height="620" fill="#0b1a2e"/>

  <!-- Title -->
  <text x="620" y="38" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="3">SOFTWARE DOCUMENTATION — SDLC FLOW</text>
  <text x="620" y="58" text-anchor="middle" fill="#5b8fa8" font-size="12">Which documentation is produced at each phase of the software development lifecycle</text>

  <!-- ──────────────────────────────────────────────────
       Phase columns: Plan · Design · Develop · Test · Deploy · Monitor
       x positions: 90, 285, 490, 695, 895, 1095
       width: 155 each
  ────────────────────────────────────────────────── -->

  <!-- Phase headers -->
  <!-- PLAN -->
  <rect x="20" y="74" width="175" height="36" rx="8" fill="#1a3a5c" stroke="#3a7ca5" stroke-width="1.6"/>
  <text x="108" y="97" text-anchor="middle" fill="#7ec8e3" font-size="13" font-weight="700">PLAN</text>

  <!-- DESIGN -->
  <rect x="215" y="74" width="175" height="36" rx="8" fill="#1a3a5c" stroke="#3a7ca5" stroke-width="1.6"/>
  <text x="303" y="97" text-anchor="middle" fill="#7ec8e3" font-size="13" font-weight="700">DESIGN</text>

  <!-- DEVELOP -->
  <rect x="410" y="74" width="175" height="36" rx="8" fill="#1a3a5c" stroke="#3a7ca5" stroke-width="1.6"/>
  <text x="498" y="97" text-anchor="middle" fill="#7ec8e3" font-size="13" font-weight="700">DEVELOP</text>

  <!-- TEST -->
  <rect x="605" y="74" width="175" height="36" rx="8" fill="#1a3a5c" stroke="#3a7ca5" stroke-width="1.6"/>
  <text x="693" y="97" text-anchor="middle" fill="#7ec8e3" font-size="13" font-weight="700">TEST</text>

  <!-- DEPLOY -->
  <rect x="800" y="74" width="175" height="36" rx="8" fill="#1a3a5c" stroke="#3a7ca5" stroke-width="1.6"/>
  <text x="888" y="97" text-anchor="middle" fill="#7ec8e3" font-size="13" font-weight="700">DEPLOY</text>

  <!-- MONITOR -->
  <rect x="995" y="74" width="230" height="36" rx="8" fill="#1a3a5c" stroke="#3a7ca5" stroke-width="1.6"/>
  <text x="1110" y="97" text-anchor="middle" fill="#7ec8e3" font-size="13" font-weight="700">MONITOR &amp; MAINTAIN</text>

  <!-- Phase arrows (horizontal flow) -->
  <line x1="195" y1="92" x2="215" y2="92" stroke="#3a7ca5" stroke-width="1.8" marker-end="url(#arrw)"/>
  <line x1="390" y1="92" x2="410" y2="92" stroke="#3a7ca5" stroke-width="1.8" marker-end="url(#arrw)"/>
  <line x1="585" y1="92" x2="605" y2="92" stroke="#3a7ca5" stroke-width="1.8" marker-end="url(#arrw)"/>
  <line x1="780" y1="92" x2="800" y2="92" stroke="#3a7ca5" stroke-width="1.8" marker-end="url(#arrw)"/>
  <line x1="975" y1="92" x2="995" y2="92" stroke="#3a7ca5" stroke-width="1.8" marker-end="url(#arrw)"/>

  <!-- ──────────────────────────────────────────────────
       Process documentation row (spans all phases)
  ────────────────────────────────────────────────── -->
  <rect x="20" y="128" width="1205" height="62" rx="10" fill="none" stroke="#2a5a7a" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="30" y="145" fill="#4a8aaa" font-size="10.5" font-style="italic">Process documentation (spans entire lifecycle)</text>
  <text x="30" y="165" fill="#7ab8d4" font-size="11.5">Plans · Estimates · Schedules · Status Reports · Working Papers · Standards · Retrospectives</text>

  <!-- ──────────────────────────────────────────────────
       Doc card rows — y starts at 205
       Row height: 62 + 8 gap = 70
  ────────────────────────────────────────────────── -->

  <!-- Row 1: y=205 -->
  <!-- PLAN: PRD, Risk management plan -->
  <rect x="20" y="205" width="175" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="108" y="222" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Product Requirement</text>
  <text x="108" y="237" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Document (PRD)</text>
  <text x="108" y="252" text-anchor="middle" fill="#7ab8d4" font-size="10">Risk management plan</text>

  <!-- DESIGN: Architecture, UX wireframes -->
  <rect x="215" y="205" width="175" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="303" y="222" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Architecture &amp; Design</text>
  <text x="303" y="237" text-anchor="middle" fill="#7ab8d4" font-size="10">System context diagrams</text>
  <text x="303" y="252" text-anchor="middle" fill="#7ab8d4" font-size="10">UX wireframes · Prototypes</text>

  <!-- DEVELOP: Source code docs, API specs, ADRs -->
  <rect x="410" y="205" width="175" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="498" y="222" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Source Code Docs</text>
  <text x="498" y="237" text-anchor="middle" fill="#7ab8d4" font-size="10">API specifications · ADRs</text>
  <text x="498" y="252" text-anchor="middle" fill="#7ab8d4" font-size="10">Inline comments · Changelog</text>

  <!-- TEST: Test plans, Test cases -->
  <rect x="605" y="205" width="175" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="693" y="222" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Test Plans &amp; Cases</text>
  <text x="693" y="237" text-anchor="middle" fill="#7ab8d4" font-size="10">Traceability matrix</text>
  <text x="693" y="252" text-anchor="middle" fill="#7ab8d4" font-size="10">Defect reports</text>

  <!-- DEPLOY: Runbooks, Release notes -->
  <rect x="800" y="205" width="175" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="888" y="222" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Runbooks</text>
  <text x="888" y="237" text-anchor="middle" fill="#7ab8d4" font-size="10">Deployment guide</text>
  <text x="888" y="252" text-anchor="middle" fill="#7ab8d4" font-size="10">Release notes (user-facing)</text>

  <!-- MONITOR: Incident playbooks, On-call guide -->
  <rect x="995" y="205" width="230" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="1110" y="222" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Incident Playbooks</text>
  <text x="1110" y="237" text-anchor="middle" fill="#7ab8d4" font-size="10">On-call guide · Monitoring ref</text>
  <text x="1110" y="252" text-anchor="middle" fill="#7ab8d4" font-size="10">Post-mortem reports</text>

  <!-- Row 2: y=278 -->
  <!-- PLAN: Agile roadmap, Capacity plan -->
  <rect x="20" y="278" width="175" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="108" y="295" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Agile Product Roadmap</text>
  <text x="108" y="310" text-anchor="middle" fill="#7ab8d4" font-size="10">Capacity plan</text>
  <text x="108" y="325" text-anchor="middle" fill="#7ab8d4" font-size="10">Communication plan</text>

  <!-- DESIGN: UX design system, Data model / ERD -->
  <rect x="215" y="278" width="175" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="303" y="295" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">UX Design System</text>
  <text x="303" y="310" text-anchor="middle" fill="#7ab8d4" font-size="10">Data model / ERD</text>
  <text x="303" y="325" text-anchor="middle" fill="#7ab8d4" font-size="10">Design review notes</text>

  <!-- DEVELOP: Contribution guide, Module READMEs -->
  <rect x="410" y="278" width="175" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="498" y="295" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Contribution Guide</text>
  <text x="498" y="310" text-anchor="middle" fill="#7ab8d4" font-size="10">Module READMEs</text>
  <text x="498" y="325" text-anchor="middle" fill="#7ab8d4" font-size="10">Design spikes</text>

  <!-- TEST: Test execution report, Security test report -->
  <rect x="605" y="278" width="175" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="693" y="295" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Test Execution Report</text>
  <text x="693" y="310" text-anchor="middle" fill="#7ab8d4" font-size="10">Performance test report</text>
  <text x="693" y="325" text-anchor="middle" fill="#7ab8d4" font-size="10">Security / SAST report</text>

  <!-- DEPLOY: Installation guide, Config reference -->
  <rect x="800" y="278" width="175" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="888" y="295" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Installation Guide</text>
  <text x="888" y="310" text-anchor="middle" fill="#7ab8d4" font-size="10">Configuration reference</text>
  <text x="888" y="325" text-anchor="middle" fill="#7ab8d4" font-size="10">Security hardening guide</text>

  <!-- MONITOR: Dependency inventory, End-of-life plan -->
  <rect x="995" y="278" width="230" height="55" rx="8" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="1110" y="295" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Dependency Inventory</text>
  <text x="1110" y="310" text-anchor="middle" fill="#7ab8d4" font-size="10">Security posture report</text>
  <text x="1110" y="325" text-anchor="middle" fill="#7ab8d4" font-size="10">End-of-life plan</text>

  <!-- Row 3: y=351  User documentation band -->
  <rect x="410" y="351" width="565" height="55" rx="8" fill="#0a1e35" stroke="#1e5070" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="693" y="368" text-anchor="middle" fill="#4a9abf" font-size="10.5" font-style="italic">User documentation — written during Develop, finalised at Deploy</text>
  <text x="498" y="390" text-anchor="middle" fill="#5fcfef" font-size="11">End-user docs · Getting started guide · User manual · FAQ · Tutorials</text>
  <text x="888" y="390" text-anchor="middle" fill="#5fcfef" font-size="11">Sys admin docs · Upgrade guide · Audit &amp; compliance guide</text>

  <!-- Row 4: y=424 — Accessibility + Usability -->
  <rect x="215" y="424" width="370" height="48" rx="8" fill="#0a1e35" stroke="#1e5070" stroke-width="1.3"/>
  <text x="400" y="441" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Accessibility &amp; Usability</text>
  <text x="400" y="460" text-anchor="middle" fill="#7ab8d4" font-size="10">Usability test reports · WCAG audit · Accessibility statement</text>

  <!-- Row 4 cont: Backup & Recovery -->
  <rect x="800" y="424" width="425" height="48" rx="8" fill="#0a1e35" stroke="#1e5070" stroke-width="1.3"/>
  <text x="1013" y="441" text-anchor="middle" fill="#5fcfef" font-size="11" font-weight="600">Backup &amp; Recovery · Integration Guides</text>
  <text x="1013" y="460" text-anchor="middle" fill="#7ab8d4" font-size="10">Backup schedule · Restore procedure · RTO/RPO · Third-party integrations</text>

  <!-- ──────────────────────────────────────────────────
       Legend
  ────────────────────────────────────────────────── -->
  <rect x="20" y="493" width="1205" height="1" fill="#1e3a54"/>

  <rect x="20" y="506" width="14" height="14" rx="3" fill="#0d2540" stroke="#2a6080" stroke-width="1.3"/>
  <text x="40" y="518" fill="#7ab8d4" font-size="11">System / Product documentation artifact</text>

  <rect x="255" y="506" width="14" height="14" rx="3" fill="#0a1e35" stroke="#1e5070" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="275" y="518" fill="#7ab8d4" font-size="11">Cross-phase documentation band</text>

  <rect x="490" y="506" width="14" height="14" rx="3" fill="none" stroke="#2a5a7a" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="510" y="518" fill="#7ab8d4" font-size="11">Process documentation (whole lifecycle)</text>

  <!-- Footer -->
  <text x="1230" y="610" text-anchor="end" fill="#2a4a64" font-size="11">copilot-governance · software-documentation-flow.svg</text>
</svg>
