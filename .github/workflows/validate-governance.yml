name: Validate Copilot governance

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "evidence/**"
      - "hooks/**"
      - "instructions/**"
      - "prompt-core/**"
      - "prompts/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate signed policy, kernel, contracts, privacy, and evidence gates
        run: |
          chmod +x scripts/*.sh
          scripts/validate-copilot-governance.sh
