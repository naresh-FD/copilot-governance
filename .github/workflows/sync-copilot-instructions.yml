name: Sync Copilot governance

on:
  push:
    branches: [main]
    paths:
      - "templates/copilot-instructions.base.md"
      - "instructions/**"
      - "prompts/**"
      - "prompt-core/**"
      - "hooks/**"
      - "repos.json"
      - "scripts/sync-copilot-instructions.sh"
      - "scripts/validate-copilot-governance.sh"
      - "scripts/copilot-gov.sh"
      - "scripts/copilot-gov.ps1"
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Optional: sync a single repo only (name, no org prefix)"
        required: false
        default: ""
  schedule:
    # Weekly safety net in case a downstream PR was closed/ignored
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: copilot-governance-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GOV_SYNC_PAT }}
      GH_ORG: ${{ vars.GH_ORG }}
      REQUIRE_GITHUB_AUTH: "true"
    steps:
      - name: Checkout governance repo
        uses: actions/checkout@v4

      # The validator runs the interception kernel's selftest, which needs node.
      # Without this step it would silently SKIP that check and ship an unvalidated
      # router or deny ruleset downstream.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate setup
        run: |
          chmod +x scripts/*.sh
          scripts/validate-copilot-governance.sh

      - name: Filter to single repo (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repo_filter != '' }}
        run: |
          jq --arg r "${{ inputs.repo_filter }}" '.repos = [$r]' repos.json > repos.filtered.json
          mv repos.filtered.json repos.json
          echo "Filtered to single repo: ${{ inputs.repo_filter }}"

      - name: Run sync
        run: |
          scripts/sync-copilot-instructions.sh
